name: Release

# Push a tag like v1.0.0 (or run manually) to build the Linux server/panel for
# amd64 and arm64 and the Android APK, and publish them as a GitHub release.
# install.sh downloads the release package, so servers do not need Go.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v1.0.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        if: matrix.arch == 'amd64'
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          pkg=klink-linux-${{ matrix.arch }}
          mkdir -p "$pkg/bin"
          go build -trimpath -ldflags='-s -w' -o "$pkg/bin/klink-server" ./cmd/server
          go build -trimpath -ldflags='-s -w' -o "$pkg/bin/klink-panel" ./cmd/panel
          cp -r web configs docs install.sh README.md "$pkg/"
          tar -czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: klink-linux-${{ matrix.arch }}
          path: klink-linux-${{ matrix.arch }}.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/core/go.mod
          cache-dependency-path: android/core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # With the ANDROID_KEYSTORE_BASE64 secret every release has the same
          # signature, so a new APK installs over the old one. Without it the
          # APK is debug-signed with a key generated for this build.
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi
      - name: Build Go core (AAR) from this commit
        working-directory: android
        run: bash build-go.sh
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/KLINK-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: KLINK-android
          path: KLINK-android.apk

  publish:
    needs: [linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum klink-linux-*.tar.gz KLINK-android.apk > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: KLINK ${{ env.TAG }}
          make_latest: true
          body: |
            **Install on Linux (Ubuntu/Debian, run as root):**
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh)
            ```
            The installer asks whether you have a domain; answer `y`, type the domain and it gets an SSL certificate automatically.

            **Android:** install `KLINK-android.apk`, press `+` and paste the subscription link from the panel.
          files: |
            klink-linux-amd64.tar.gz
            klink-linux-arm64.tar.gz
            KLINK-android.apk
            SHA256SUMS

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/core/go.mod
          cache-dependency-path: |
            go.sum
            android/core/go.sum
      - name: Server and panel
        run: |
          go vet ./...
          go test -race ./...
      - name: Android client core against the real server
        working-directory: android/core
        run: |
          go vet ./...
          go test -race ./...
      - name: Installer syntax
        run: bash -n install.sh && shellcheck -S warning -e SC2034 install.sh
